html,body{margin:0;height:100%;background:#0b0908;color-scheme:dark}
body{display:flex;align-items:center;justify-content:center;font-family:'Cinzel',Georgia,serif;
 background:radial-gradient(ellipse at 50% 42%,#1e1a17 0%,#0b0908 72%)}
form{display:flex;flex-direction:column;gap:16px;width:min(300px,86vw)}
label{color:#8f8173;letter-spacing:4px;font-size:15px;text-align:center}
input,button{font:inherit;border-radius:5px;border:1px solid #4b4038;height:56px;box-sizing:border-box}
input{background:#120f0d;color:#c7d9e4;padding:0 16px;font-size:20px;letter-spacing:3px;text-align:center}
input:focus{outline:2px solid #9fc0d8;outline-offset:2px}
button{background:linear-gradient(170deg,#3a332d,#25201c 55%,#1c1815);color:#e0302a;font-size:22px;font-weight:700;
 letter-spacing:8px;text-shadow:0 0 10px rgba(220,40,30,.6);box-shadow:0 6px 14px rgba(0,0,0,.7)}
button:disabled{opacity:.6}
#err{min-height:1.2em;margin:0;color:#b9a48e;font-family:Georgia,serif;font-size:14px;text-align:center}
</style>

const u8 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function open(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(D.s), iterations: D.n, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(D.i) }, key, u8(D.c)));
  try { localStorage.setItem('komnata-pw', pw); } catch (e) {}
  document.open(); document.write(html); document.close();
}
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; err.textContent = '';
  try { await open(document.getElementById('pw').value); }
  catch (x) { err.textContent = 'Złe hasło.'; go.disabled = false; }
};
// Remembered on this device after the first correct entry.
let saved = null;
try { saved = localStorage.getItem('komnata-pw'); } catch (e) {}
if (saved) open(saved).catch(() => { try { localStorage.removeItem('komnata-pw'); } catch (e) {} });
