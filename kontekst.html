const u8 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function open(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(D.s), iterations: D.n, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(D.i) }, key, u8(D.c)));
  try { localStorage.setItem('komnata-pw', pw); } catch (e) {}
  document.open(); document.write(html); document.close();

document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; err.textContent = '';
  try { await open(document.getElementById('pw').value); }
  catch (x) { err.textContent = 'Złe hasło.'; go.disabled = false; }

// Remembered on this device after the first correct entry.
let saved = null;
