name: Android APK

on:
  push:
    branches: [main]
    paths: [android.enc, .github/workflows/android.yml, tools/encbin.mjs]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decrypt sources
        env:
          PW: ${{ secrets.APP_PASSWORD }}
        run: node tools/encbin.mjs dec "$PW" < android.enc | tar xz

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Encrypt and publish APK
        env:
          PW: ${{ secrets.APP_PASSWORD }}
        run: |
          node tools/encbin.mjs enc "$PW" < android/app/build/outputs/apk/debug/app-debug.apk > apk.bin
          rm -rf android
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add apk.bin
          git commit -m "APK z ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main
